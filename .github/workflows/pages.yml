# WHY: Public live demos without cloning — GitHub Pages serves examples/ + vendor/.
# WHAT: build:widget stages vendor/; deploy examples/ on every main push.
# GUARDED: Repo Settings → Pages → Source: GitHub Actions (one-time).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build widget + stage examples/vendor
        run: npm run build:widget

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
