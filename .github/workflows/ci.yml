# WHY: Every PR must pass MDP contract, public scrub, and unit tests before merge.
# WHAT: CI gate for @meos/save-in-meos — no publish, no secrets required.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Upgrade npm (parity with release OIDC path)
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: MDP contract + widget branding
        run: npm run check:mdp

      - name: Public scrub
        run: npm run check:public-scrub

      - name: CI workflow ratchet
        run: npm run check:ci

      - name: Unit tests
        run: npm test

      - name: Build library + widget bundle
        run: npm run build && npm run build:widget
