# WHY: Published npm tarball is the source of truth for unpkg/jsDelivr CDN mirrors.
# WHAT: Build, verify, and npm publish on GitHub Release (or manual dispatch).
# GUARDED: Requires NPM_TOKEN secret — see docs/PUBLISHING.md.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip npm publish (build + verify only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build library + widget bundle
        run: npm run build && npm run build:widget

      - name: MDP contract + widget branding
        run: npm run check:mdp

      - name: Public scrub
        run: npm run check:public-scrub

      - name: CI workflow ratchet
        run: npm run check:ci

      - name: Unit tests
        run: npm test

      - name: Publish to npm
        if: github.event_name == 'release' || inputs.dry_run != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
